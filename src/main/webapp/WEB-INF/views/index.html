<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:charset="UTF-8">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/images/weather-app.png}">
            <img th:src="@{/images/weather-app.png}" alt="" width="30" height="24"
                 class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3">zhukovsd</span>
            <form th:action="@{/auth/sign-out}" th:method="POST">
                <input type="submit" value="Sign Out" class="btn btn-primary">
            </form>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <div class="d-flex my-4">
            <form th:action="@{/locations/search}" th:method="GET">
                <label for="name" class="form-label">Name</label>
                <input id="name" type="search" name="name" placeholder="Enter Name Here">
                <input class="btn btn-primary" type="submit" value="Search">
            </form>
        </div>

        <div>
            <div class="row">
                <div th:each="location : ${locations}" class="col-12 col-lg-3 col-md-6 mb-4">
                    <div class="card h-100 position-relative weather-card">
                        <div class="position-absolute weather-card-delete-form">
                            <form th:action="@{/locations}" th:method="DELETE">
                                <input type="hidden" th:value="${location.lat()}" name="latitude">
                                <input type="hidden" th:value="${location.lon()}" name="longitube">
                                <button class="btn-close" aria-label="Delete"></button>
                            </form>
                        </div>
                        <img class="card-img-top img-fluid"
                             th:src="@{'https://openweathermap.org/img/wn/' + ${location.icon()} + '@4x.png'}"
                             alt="Weather icon">
                        <div class="card-body d-flex flex-column">

                            <h1 class="card-text" th:text="${location.temp()} + '°C.'"></h1>
                            <h3 class="card-title" th:text="${location.name()} + ' ' + ${location.country()}"></h3>
                            <p class="card-text mb-1" th:text=" 'Feels like ' +  ${location.feelsLike()} + ' °C.'">
                            <p th:text=" ${location.description()}"></p>
                            <p class="card-text mb-1" th:text="'humidity : ' + ${location.humidity()} + '%'"></p>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>

</body>
</html>
