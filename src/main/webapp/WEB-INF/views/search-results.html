<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/images/weather-app.png}">
            <img th:src="@{/images/weather-app.png}" alt="" width="30" height="24"
                 class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3">zhukovsd</span>
            <form th:action="@{/auth/sign-out}" th:method="POST">
                <input type="submit" value="Sign Out" class="btn btn-primary">
            </form>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <div class="d-flex my-4">
            <form th:action="@{/locations/search}" th:method="GET">
                <label for="name" class="form-label">Name</label>
                <input id="name" th:value="${name}" type="search" name="name" placeholder="Enter Name Here">
                <input class="btn btn-primary" type="submit" value="Search">
            </form>

        </div>

        <div>
            <h2>Locations:</h2>
            <div class="row">
                <div class="col-12 col-lg-3 col-md-6 mb-4" th:each="location : ${locations}">
                    <div class="card h-100">
                        <div class="card-body d-flex flex-column">
                            <h5 th:text="${location.name()}"></h5>
                            <p class="card-text mb-1" th:text="'Latitude: ' + ' ' + ${location.lat()}"></p>
                            <p class="card-text mb-1" th:text="'Longitude: ' + ' ' + ${location.lon()}"></p>
                            <p class="card-text mb-1" th:text="'Country: ' + ${location.country()}"></p>
                            <p class="card-text mb-3" th:text="'State: ' + ${location.state()}"></p>
                            <div class="mt-auto">
                                <form th:action="@{/locations/add}" th:method="POST">
                                    <input th:value="${location.lat()}" th:type="hidden" th:name="lat">
                                    <input th:value="${location.lon()}" th:type="hidden" th:name="lon">
                                    <input th:value="${location.name()}" th:type="hidden" th:name="name">
                                    <input type="submit" value="Add" class="btn btn-primary">
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>

</body>
</html>
